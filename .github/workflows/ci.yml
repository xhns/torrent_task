name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Clone sibling deps
        run: |
          for r in bencode_dart dartorrent_common utp torrent_model torrent_tracker dht; do
            git clone --depth 1 --branch chore/modernize-dart3 \
              https://github.com/xhns/$r.git "$GITHUB_WORKSPACE/../$r"
          done

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
