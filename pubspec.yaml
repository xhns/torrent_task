name: torrent_task
description: BitTorrent download client package written by pure Dart language.
version: 0.5.0
repository: https://github.com/eclipseglory/torrent_task
issue_tracker: https://github.com/eclipseglory/torrent_task/issues
# All dependencies are local path deps for the modernized Dart 3 stack, so
# this package is not published to pub.dev.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  crypto: ^3.0.2
  path: ^1.8.0
  torrent_model:
    path: ../torrent_model
  torrent_tracker:
    path: ../torrent_tracker
  dht_dart:
    path: ../dht
  dartorrent_common:
    path: ../dartorrent_common
  bencode_dart:
    path: ../bencode_dart
  utp:
    path: ../utp

dev_dependencies:
  lints: ^4.0.0
  test: ^1.14.4
